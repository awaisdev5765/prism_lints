name: prism_lints
description: >-
  Lint rules that keep the Prism design system honest: flag spacing, radii,
  durations and colours that duplicate a design token, so an app cannot drift
  away from the system it installed.
version: 0.1.0
homepage: https://github.com/awaisdev5765/prism_lints
repository: https://github.com/awaisdev5765/prism_lints
issue_tracker: https://github.com/awaisdev5765/prism_lints/issues
topics:
  - lints
  - design-system
  - custom-lint
  - flutter

environment:
  sdk: ^3.5.0

dependencies:
  analyzer: ">=6.0.0 <9.0.0"
  custom_lint_builder: ">=0.6.0 <0.9.0"

dev_dependencies:
  custom_lint: ">=0.6.0 <0.9.0"
  test: ^1.25.0
  lints: ^5.0.0
